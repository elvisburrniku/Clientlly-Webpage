kind = "web"
previewPath = "/"
title = "Clientlly Webpage"
version = "1.0.0"
id = "clientlly-webpage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.env]
PORT = "5000"
BASE_PATH = "/"

[services.development]
run = "npm run dev"

[services.production]

[services.production.build]
args = ["npm", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "dist/index.js"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "5000"

[services.production.health.startup]
path = "/"
